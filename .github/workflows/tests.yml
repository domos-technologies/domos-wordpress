name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The plugin's dependencies require PHP 8.2 (roots/acorn 5 and illuminate/support
  # 12 both declare it), so that is the floor the matrix starts at.
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # vendor/ is committed for distribution, but installing here means the
      # suite runs against the versions in composer.lock rather than whatever
      # happened to be committed.
      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: composer test

  # src/Dependencies is generated by Strauss and committed: the release build
  # copies the working tree and then installs runtime dependencies only, and
  # Strauss is a dev dependency that is not available there. That makes it easy to
  # bump the library and forget to re-scope, so regenerate it and compare. Only
  # the copied package is compared - the composer-generated autoloader next to it
  # can differ between Composer versions for reasons unrelated to staleness.
  scoping:
    name: scoped dependencies are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: composer strauss

      - name: Fail if the committed copy is stale
        run: |
          if [ -n "$(git status --porcelain src/Dependencies/deliciousbrains)" ]; then
            echo "src/Dependencies is out of date - run 'composer strauss' and commit the result."
            git --no-pager diff --stat -- src/Dependencies
            exit 1
          fi

  # Builds the distribution archive exactly the way release.sh does, so a broken
  # filter list (shipping the test suite or the dev tooling to customers) fails
  # here instead of at release time.
  package:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No composer install here on purpose: vendor/ is committed and
      # vendor/composer/installed.php records the commit it was installed from,
      # so any composer run rewrites that file and leaves the tree dirty - which
      # the release script's preflight correctly refuses. The archive step
      # installs its own runtime dependencies in the staging copy.
      - run: bun install --frozen-lockfile

      # public/ is committed output, and the release copies the working tree
      # instead of building it, so a stylesheet or bundle that was not rebuilt
      # after a view change ships stale. That is not cosmetic: a new panel's
      # utility classes are simply absent from the CSS, so it renders unstyled on
      # customer sites (found the hard way with the "nothing to synchronise"
      # notice, whose amber background never made it into the committed file).
      - name: Fail if the committed assets are stale
        run: |
          bun run build
          if [ -n "$(git status --porcelain public)" ]; then
            echo "public/ is out of date - run 'bun run build' and commit the result."
            git --no-pager diff --stat -- public
            exit 1
          fi

      # Runs preflight, tests, the asset build and the archive verification, but
      # stops before anything is pushed or published.
      - name: Release build
        run: |
          VERSION="$(php -r 'preg_match("/ \* Version: +([0-9.]+)/", file_get_contents("domos-core.php"), $m); echo $m[1];')"
          ./release.sh "$VERSION" --dry-run
